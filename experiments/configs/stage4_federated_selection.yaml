# Stage 4 - federated feature selection with three simulated sites.
#
# SYNTHETIC DATA with a planted structure, used only to check that the protocol
# and the aggregation behave as designed. It has no scientific meaning, and the
# strategies, thresholds and weights below are examples to compare, not choices.
#
#   feat_strong     strong effect at every site, reliable
#   feat_copy       near-copy of feat_strong (redundant)
#   feat_noisy      strong effect but poorly reproducible (high measurement noise)
#   feat_mixed      opposite effects across sites (between-site disagreement)
#   feat_moderate   moderate effect at every site, reliable
#   feat_n01..n10   no relation to conversion
schema_version: 1
name: stage4-federated-selection
description: Federated selection over four dimensions with several strategies compared.
seed: 20261118
data_origin: synthetic

privacy:
  min_cohort_size: 10
  min_clients_per_aggregate: 2
  min_events: 5

expected_clients: [client-01, client-02, client-03]

feature_selection:
  reliability_column: min_icc
  redundancy:
    correlation: spearman
    max_candidates: 20
  leave_one_site_out: true
  strategies:
    - name: sequential_stratified
      reliability: {aggregation: minimum, min_value: 0.75}
      relevance: {aggregation: stratified_score}
      agreement: {method: i_squared, min_value: 0.5}
      ranking: {kind: sequential}
      max_abs_correlation: 0.8
      n_features: 3
    - name: sequential_stouffer
      reliability: {aggregation: minimum, min_value: 0.75}
      relevance: {aggregation: stouffer}
      agreement: {method: i_squared, min_value: 0.5}
      ranking: {kind: sequential}
      max_abs_correlation: 0.8
      n_features: 3
    - name: sequential_mean_rank
      reliability: {aggregation: weighted_mean, min_value: 0.75}
      relevance: {aggregation: mean_rank}
      agreement: {method: sign_consistency, min_value: 1.0}
      ranking: {kind: sequential}
      max_abs_correlation: 0.8
      n_features: 3
    - name: weighted_equal
      reliability: {aggregation: minimum, min_value: -1.0}
      relevance: {aggregation: stratified_score}
      agreement: {method: i_squared, min_value: 0.0}
      ranking: {kind: weighted, weights: {reliability: 1, relevance: 1, agreement: 1}}
      max_abs_correlation: 0.8
      n_features: 3
    - name: weighted_relevance_heavy
      reliability: {aggregation: minimum, min_value: -1.0}
      relevance: {aggregation: stratified_score}
      agreement: {method: i_squared, min_value: 0.0}
      ranking: {kind: weighted, weights: {reliability: 0.2, relevance: 0.6, agreement: 0.2}}
      max_abs_correlation: 0.8
      n_features: 3
    - name: relevance_only
      reliability: null
      relevance: {aggregation: stratified_score}
      agreement: null
      ranking: {kind: sequential}
      max_abs_correlation: null
      n_features: 3

simulation:
  clients:
    - client_id: client-01
      data_source: &site
        kind: synthetic
        n_participants: 300
        feature_names: [feat_strong, feat_copy, feat_noisy, feat_mixed, feat_moderate,
                        feat_n01, feat_n02, feat_n03, feat_n04, feat_n05,
                        feat_n06, feat_n07, feat_n08, feat_n09, feat_n10]
        derived_features:
          feat_copy: {source: feat_strong, noise_sd: 0.15}
        log_hazard_effects: {feat_strong: 0.8, feat_noisy: 0.8, feat_mixed: 0.9,
                             feat_moderate: 0.4}
        measurement_noise_sd: {feat_noisy: 2.0}
    - client_id: client-02
      data_source:
        <<: *site
        n_participants: 250
        log_hazard_effects: {feat_strong: 0.8, feat_noisy: 0.8, feat_mixed: -0.9,
                             feat_moderate: 0.4}
    - client_id: client-03
      data_source:
        <<: *site
        n_participants: 350
        log_hazard_effects: {feat_strong: 0.8, feat_noisy: 0.8, feat_mixed: -0.9,
                             feat_moderate: 0.4}
