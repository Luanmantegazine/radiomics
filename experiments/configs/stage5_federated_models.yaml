# Stage 5 - federated selection followed by federated prognostic models.
#
# SYNTHETIC DATA with a planted structure (see stage4_federated_selection.yaml),
# used only to check the training protocol. Hyper-parameters are examples.
#
# Each site keeps 30% of its participants as a held-out test partition: feature
# selection and model fitting see only the remaining 70% (evaluation: Stage 6).
schema_version: 1
name: stage5-federated-models
description: Federated selection on the training partition, then Cox and horizon logistic models.
seed: 20261118

data_split:
  test_fraction: 0.3
  seed: 7
data_origin: synthetic

privacy:
  min_cohort_size: 10
  min_clients_per_aggregate: 2
  min_events: 5

expected_clients: [client-01, client-02, client-03]

feature_selection:
  reliability_column: min_icc
  redundancy:
    correlation: spearman
    max_candidates: 20
  leave_one_site_out: true
  strategies:
    - name: sequential_stratified
      reliability: {aggregation: minimum, min_value: 0.75}
      relevance: {aggregation: stratified_score}
      agreement: {method: i_squared, min_value: 0.5}
      ranking: {kind: sequential}
      max_abs_correlation: 0.8
      n_features: 3
    - name: sequential_stouffer
      reliability: {aggregation: minimum, min_value: 0.75}
      relevance: {aggregation: stouffer}
      agreement: {method: i_squared, min_value: 0.5}
      ranking: {kind: sequential}
      max_abs_correlation: 0.8
      n_features: 3
    - name: sequential_mean_rank
      reliability: {aggregation: weighted_mean, min_value: 0.75}
      relevance: {aggregation: mean_rank}
      agreement: {method: sign_consistency, min_value: 1.0}
      ranking: {kind: sequential}
      max_abs_correlation: 0.8
      n_features: 3
    - name: weighted_equal
      reliability: {aggregation: minimum, min_value: -1.0}
      relevance: {aggregation: stratified_score}
      agreement: {method: i_squared, min_value: 0.0}
      ranking: {kind: weighted, weights: {reliability: 1, relevance: 1, agreement: 1}}
      max_abs_correlation: 0.8
      n_features: 3
    - name: weighted_relevance_heavy
      reliability: {aggregation: minimum, min_value: -1.0}
      relevance: {aggregation: stratified_score}
      agreement: {method: i_squared, min_value: 0.0}
      ranking: {kind: weighted, weights: {reliability: 0.2, relevance: 0.6, agreement: 0.2}}
      max_abs_correlation: 0.8
      n_features: 3
    - name: relevance_only
      reliability: null
      relevance: {aggregation: stratified_score}
      agreement: null
      ranking: {kind: sequential}
      max_abs_correlation: null
      n_features: 3

training:
  horizons_months: [12, 24, 36]
  models:
    - model:
        kind: cox
        name: cox_selected
        optimizer: {ridge: 1.0, max_iterations: 25, tolerance: 1.0e-10}
      features: {from_strategy: sequential_stratified}
    - model:
        kind: cox
        name: cox_relevance_only
        optimizer: {ridge: 1.0, max_iterations: 25, tolerance: 1.0e-10}
      features: {from_strategy: relevance_only}
    - model:
        kind: horizon_logistic
        name: logistic_ipcw_site
        censoring: ipcw
        intercept: site_specific
        optimizer: {ridge: 1.0, max_iterations: 25, tolerance: 1.0e-10}
      features: {from_strategy: sequential_stratified}
    - model:
        kind: horizon_logistic
        name: logistic_ipcw_common
        censoring: ipcw
        intercept: common
        optimizer: {ridge: 1.0, max_iterations: 25, tolerance: 1.0e-10}
      features: {from_strategy: sequential_stratified}
    - model:
        kind: horizon_logistic
        name: logistic_complete_case_site
        censoring: complete_case
        intercept: site_specific
        optimizer: {ridge: 1.0, max_iterations: 25, tolerance: 1.0e-10}
      features: {from_strategy: sequential_stratified}
    - model:
        kind: cox
        name: cox_reference
        optimizer: {ridge: 1.0, max_iterations: 25, tolerance: 1.0e-10}
      features: {names: [feat_strong, feat_moderate]}

simulation:
  clients:
    - client_id: client-01
      data_source: &site
        kind: synthetic
        n_participants: 300
        feature_names: [feat_strong, feat_copy, feat_noisy, feat_mixed, feat_moderate,
                        feat_n01, feat_n02, feat_n03, feat_n04, feat_n05,
                        feat_n06, feat_n07, feat_n08, feat_n09, feat_n10]
        derived_features:
          feat_copy: {source: feat_strong, noise_sd: 0.15}
        log_hazard_effects: {feat_strong: 0.8, feat_noisy: 0.8, feat_mixed: 0.9,
                             feat_moderate: 0.4}
        measurement_noise_sd: {feat_noisy: 2.0}
    - client_id: client-02
      data_source:
        <<: *site
        n_participants: 250
        log_hazard_effects: {feat_strong: 0.8, feat_noisy: 0.8, feat_mixed: -0.9,
                             feat_moderate: 0.4}
    - client_id: client-03
      data_source:
        <<: *site
        n_participants: 350
        log_hazard_effects: {feat_strong: 0.8, feat_noisy: 0.8, feat_mixed: -0.9,
                             feat_moderate: 0.4}
