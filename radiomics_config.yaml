# ---------------------------------------------------------------------------
# OASIS-3 Alzheimer radiomics acquisition protocol v1.0
# ---------------------------------------------------------------------------
# This file is now the frozen acquisition configuration. Changes to image
# preprocessing, ROI definitions or feature extraction must increment the
# protocol version documented in oasis_radiomics/protocol.py.
# ---------------------------------------------------------------------------

radiomics:
  # Fixed-bin-width discretisation. This is the value used in the validated
  # pilot and is now frozen for acquisition consistency.
  binWidth: 25

  # MRI has no absolute intensity scale. PyRadiomics z-score normalisation is
  # applied independently to each T1 before discretisation.
  normalize: true
  normalizeScale: 100

  correctMask: true
  label: 1

  # Disabled because the validated macOS/arm64 environment was unstable with
  # native extensions in earlier dependency combinations. This changes speed,
  # not the mathematical feature definitions.
  enableCExtensions: false

  # OASIS-3 FreeSurfer conformed T1/segmentation volumes are used in their
  # common native processing geometry. No second interpolation is introduced
  # during acquisition.
  # resampledPixelSpacing: null

# Acquisition is intentionally restricted to Original T1. Wavelet and LoG can
# only be introduced as a separate protocol/version, never mid-cohort.
image_types:
  Original: true

# The classes must remain in this order. Individual feature names are frozen in
# oasis_radiomics/protocol.py and total exactly 107 per ROI.
features:
  firstorder: true
  shape: true
  glcm: true
  glrlm: true
  glszm: true
  gldm: true
  ngtdm: true

# ---------------------------------------------------------------------------
# Alzheimer ROIs: 8 bilateral anatomical regions = 16 masks/session.
# All labels are read from FreeSurfer aparc+aseg.mgz.
# ---------------------------------------------------------------------------
rois:
  left_hippocampus: [17]
  right_hippocampus: [53]
  left_amygdala: [18]
  right_amygdala: [54]
  left_entorhinal: [1006]
  right_entorhinal: [2006]
  left_fusiform: [1007]
  right_fusiform: [2007]
  left_inferior_temporal: [1009]
  right_inferior_temporal: [2009]
  left_middle_temporal: [1015]
  right_middle_temporal: [2015]
  left_parahippocampal: [1016]
  right_parahippocampal: [2016]
  left_precuneus: [1025]
  right_precuneus: [2025]

bilateral:
  # Never send a disconnected left+right union mask to PyRadiomics.
  extract_union_mask: false

  # Hippocampal bilateral derivatives are retained for compatibility with the
  # longitudinal pilot. Every one of the 16 raw ROIs remains available in the
  # long table independently.
  left_roi: left_hippocampus
  right_roi: right_hippocampus

  additive_features:
    - mask_voxels
    - mask_volume_mm3
    - original_shape_MeshVolume
    - original_shape_VoxelVolume
    - original_shape_SurfaceArea

  asymmetry_mode: positive_only

quality_control:
  # These hard anatomical sanity bounds apply to the hippocampal anchor pair.
  # Other protocol ROIs are required to be present and non-empty; cohort-level
  # distribution checks are handled separately and never auto-delete a scan.
  min_hippocampus_volume_mm3: 1000.0
  max_hippocampus_volume_mm3: 7000.0
  min_hippocampus_voxels: 500
  max_absolute_volume_asymmetry: 0.20

  outliers:
    method: mad
    threshold: 3.5
    iqr_multiplier: 1.5
    min_samples: 8
    columns:
      - left_volume_mm3
      - right_volume_mm3
      - total_volume_mm3
      - volume_asymmetry

longitudinal:
  delta_comparisons: [consecutive, baseline]
  min_sessions_for_slope: 2
  days_per_year: 365.25
